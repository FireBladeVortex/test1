<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<title>유튜브 구간 반복 재생</title>
	<link rel="stylesheet" href="css/vid-t.css">
</head>

<body>
	<div id="box">

		<div id="left">
		</div>
		
		<div id="right">
			<h1><span id="alert_btn">!</span><span id="help_btn">?</span></h1>
			<div id="player">
				<div id="ad"></div>
				<div id="you_player"></div>
			</div>
			<div id="play_bar">
				<div id="play_now"></div>
			</div>
			<div id="play_msg">재생 목록에서 선택하세요</div>
			<div id="volume">
				<input id="volume_bar" type="range" min="0" max="100" value="25" step="1">
			</div>
		</div>

	</div>
	<div id="popup"><span id="popup_close">x</span><span id="popup_txt"></span></div>

</body>

<script src="data/list_video.js"></script>
<script src="data/list_short.js"></script>
<script src="data/list_long.js"></script>
<script src="js/newapi.js"></script>
<script src="anne/anne.js"></script>

</html>
