<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pip_player</title>
<style>
  :root {
    --bg: #0b0d10;
    --panel: #14171c;
    --accent: #ff3b3b;
    --text: #e9ecf1;
    --text_dim: #8b93a1;
    --border: #232730;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 40px 16px;
  }

  h1 {
    font-size: 20px;
    font-weight: 600;
    letter-spacing: -0.02em;
    margin: 0 0 24px;
    color: var(--text);
  }

  .player_wrap {
    width: 100%;
    max-width: 720px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }

  .video_box {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
  }

  #youtube_player {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
  }

  /* #pip_video_proxy { ... } -- 삭제 (getDisplayMedia 방식 전용, 내장 PiP 방식에선 불필요) */

  .controls {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    border-top: 1px solid var(--border);
  }

  .status {
    font-size: 13px;
    color: var(--text_dim);
  }

  .pip_button {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s ease;
  }

  .pip_button:hover { opacity: 0.85; }
  .pip_button:disabled {
    background: var(--border);
    color: var(--text_dim);
    cursor: not-allowed;
  }

  .pip_button svg { width: 16px; height: 16px; }

  .hint {
    max-width: 720px;
    margin-top: 16px;
    font-size: 12.5px;
    color: var(--text_dim);
    line-height: 1.6;
  }
</style>
</head>
<body>

<h1>YouTube PiP Player</h1>

<div class="player_wrap">
  <div class="video_box">
    <iframe
      id="youtube_player"
      src="https://www.youtube.com/embed/dQw4w9WgXcQ?playsinline=1"
      title="YouTube video player"
      frameborder="0"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
      allowfullscreen>
    </iframe>
  </div>
  <div class="controls">
    <span class="status" id="status_text">플레이어 로딩중...</span>
    <button class="pip_button" id="pip_btn" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="18" height="18" rx="2"/>
        <rect x="12" y="12" width="8" height="6" rx="1" fill="currentColor"/>
      </svg>
      PiP로 보기
    </button>
  </div>
</div>

<p class="hint">
  YouTube 영상 자체에 내장된 Picture-in-Picture 기능을 사용합니다.<br>
  버튼을 누르면 영상에 포커스가 이동하며, 영상을 우클릭해 'PIP(자동 그림 속 그림)'을<br>
  선택하면 PiP 모드로 전환됩니다. Chrome / Edge 계열에서 지원됩니다.
</p>

<script>
  // var tag = document.createElement('script'); -- 삭제
  // tag.src = "https://www.youtube.com/iframe_api"; -- 삭제
  // document.head.appendChild(tag); -- 삭제
  //
  // var player; -- 삭제
  // var video_id = "dQw4w9WgXcQ"; -- 삭제
  //
  // function onYouTubeIframeAPIReady() { ... } -- 삭제 (정적 iframe 사용으로 불필요)
  //
  // function on_player_ready() { ... } -- 삭제 (정적 iframe 사용으로 불필요)
  // 삭제

  document.getElementById('status_text').textContent = "재생 준비 완료"; // (수정)
  document.getElementById('pip_btn').disabled = false; // (수정)

  var pip_btn = document.getElementById('pip_btn');

  pip_btn.addEventListener('click', function () {
    // iframe에 포커스를 주고 우클릭 메뉴 사용을 안내 (수정/추가)
    var yt_iframe = document.getElementById('youtube_player');
    if (yt_iframe) {
      yt_iframe.focus();
    }

    document.getElementById('status_text').textContent =
      "영상에 포커스되었습니다. 영상을 우클릭 후 'PIP(자동 그림 속 그림)'을 선택하세요";
  });
</script>

</body>
</html>
